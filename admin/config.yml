- name: cai_dat
  label: Cài đặt
  icon: settings
  description: Thông tin công ty, menu, câu chữ dùng chung, SEO, mã theo dõi, chuyển hướng, ảnh thương hiệu.
  files:
  - name: cong_ty
    label: Thông tin công ty
    file: content/cai-dat/cong-ty.yml
    format: yml
    fields:
    - name: ten_phap_nhan
      label: Tên pháp nhân
      widget: string
      maxlength: 80
    - name: ten_ngan
      label: Tên ngắn
      widget: string
      hint: Dùng làm đuôi tiêu đề trang và trong câu chữ.
      maxlength: 40
    - name: thuong_hieu
      label: Tên thương hiệu
      widget: string
      maxlength: 40
    - name: khau_hieu
      label: Khẩu hiệu
      widget: string
      maxlength: 60
    - name: luat_su
      label: Luật sư phụ trách
      widget: string
      hint: 'Ví dụ: Luật sư Nguyễn Trọng Nam'
      maxlength: 60
    - name: chuc_danh_luat_su
      label: Chức danh trên thẻ “Luật sư phụ trách”
      widget: string
      maxlength: 90
    - name: hotline
      label: Hotline
      widget: string
      hint: 'Số di động 10 số, có thể có dấu cách: 0983 498 499. Nút Gọi, Zalo, dữ liệu Google tự cập nhật.'
      pattern:
      - ^0[0-9 .]{9,13}$
      - Số điện thoại Việt Nam bắt đầu bằng 0, ví dụ 0983 498 499
    - name: zalo
      label: Liên kết Zalo
      widget: string
      hint: Để trống = https://zalo.me/<hotline>.
      required: false
      pattern:
      - ^(https://zalo\.me/.+)?$
      - Bắt đầu bằng https://zalo.me/
    - name: email
      label: Email
      widget: string
      pattern:
      - ^[^@\s]+@[^@\s]+\.[a-z]{2,}$
      - Email chưa đúng định dạng
    - name: dia_chi
      label: Địa chỉ văn phòng
      widget: object
      fields:
      - name: so_nha_duong
        label: Số nhà, đường
        widget: string
        maxlength: 80
      - name: phuong
        label: Phường/xã
        widget: string
        maxlength: 80
      - name: thanh_pho
        label: Tỉnh/thành phố
        widget: string
        maxlength: 80
      - name: thanh_pho_viet_tat
        label: Tỉnh/thành phố viết tắt
        widget: string
        hint: Dùng ở dải địa chỉ ngắn, vd. TP.HCM
        maxlength: 20
    - name: gio_lam_viec
      label: Giờ làm việc
      widget: object
      fields:
      - name: ngay
        label: Ngày làm việc
        widget: select
        options:
        - label: Thứ 2
          value: Monday
        - label: Thứ 3
          value: Tuesday
        - label: Thứ 4
          value: Wednesday
        - label: Thứ 5
          value: Thursday
        - label: Thứ 6
          value: Friday
        - label: Thứ 7
          value: Saturday
        - label: Chủ nhật
          value: Sunday
        multiple: true
        min: 1
        dropdown_threshold: 7
      - name: mo_cua
        label: Giờ mở cửa
        widget: string
        pattern:
        - ^([01][0-9]|2[0-3]):[0-5][0-9]$
        - Giờ dạng 24 giờ, ví dụ 08:00 hoặc 17:30
      - name: dong_cua
        label: Giờ đóng cửa
        widget: string
        pattern:
        - ^([01][0-9]|2[0-3]):[0-5][0-9]$
        - Giờ dạng 24 giờ, ví dụ 08:00 hoặc 17:30
      - name: hien_thi
        label: Cách viết giờ làm việc (tùy chọn)
        widget: string
        hint: 'Để trống = tự viết, vd. “Thứ 2 – Thứ 6: 08:00 – 17:30”.'
        required: false
        maxlength: 80
      - name: ngoai_gio
        label: Ghi chú ngoài giờ
        widget: string
        maxlength: 140
    - name: gioi_thieu_chan_trang
      label: Giới thiệu ngắn ở chân trang
      widget: richtext
      hint: 'Liên kết trong site: dán đường dẫn bắt đầu bằng / (vd. /dich-vu/thua-ke/). Mã chèn tự cập nhật: {{luat_su}}, {{hotline}}, {{email}}, {{dia_chi}}, {{gio_lam_viec}}, {{ngoai_gio}}.'
