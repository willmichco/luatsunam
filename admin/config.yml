    - label: Tài liệu
      value: i-doc
    - label: Một người
      value: i-user
    - label: Nhóm người
      value: i-team
    - label: Mạng lưới
      value: i-network
    - label: Kim cương
      value: i-diamond
    - label: Các bước
      value: i-steps
    - label: Sách
      value: i-book
    - label: Dấu hỏi
      value: i-question
    - label: Ổ khóa
      value: i-lock
    - label: Tiền / chi phí
      value: i-coin
    - label: Đồng hồ
      value: i-clock
    - label: Lịch
      value: i-calendar
    - label: Tin nhắn
      value: i-chat
    - label: Điện thoại
      value: i-phone
    - label: Thư
      value: i-mail
    - label: Ghim địa điểm
      value: i-pin
    - label: Dấu tích tròn
      value: i-check-circle
    - label: Danh sách
      value: i-list
    - label: Cảnh báo
      value: i-alert
    dropdown_threshold: 0
  - name: mo_ta_ngan
    label: Mô tả ngắn
    widget: text
    hint: Hiện ở thẻ lĩnh vực, khung cạnh bài viết, ảnh chia sẻ.
    minlength: 50
    maxlength: 180
  - name: the_tinh_huong
    label: Thẻ “Anh chị đang gặp chuyện gì?”
    widget: object
    fields:
    - name: tieu_de
      label: Tình huống
      widget: string
      hint: 'Ví dụ: Chia đất, chia nhà sau khi cha mẹ mất'
      maxlength: 70
