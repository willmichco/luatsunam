  - name: nguyen_tac
    label: Hộp “Cách luật sư làm việc”
    widget: object
    fields:
    - name: tieu_de
      label: Tiêu đề
      widget: string
      maxlength: 80
    - name: noi_dung
      label: Nội dung
      widget: text
