lien_he:
  tieu_de: Kiểm tra trước khi ký để không mất tiền oan
  doan_moi: Chuẩn bị sẵn giấy tờ nhà đất đang có rồi gọi điện hoặc nhắn Zalo cho luật sư. Luật sư sẽ cho biết cần xác minh thêm điều gì trước khi anh chị xuống tiền.
