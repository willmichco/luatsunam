name: Build và đăng website (GitHub Pages)

# Mỗi lần lưu trong /admin (hoặc push vào main): build từ content/ → kiểm → đăng dist/ lên nhánh gh-pages.
# Build lỗi: KHÔNG đăng (site giữ bản cũ) và mở issue "Build lỗi" kèm lỗi tiếng Việt → GitHub gửi email cho quản trị.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Dùng lại ảnh đã xử lý ở lần trước
        uses: actions/cache@v4
        with:
          path: .cache
          key: img-${{ hashFiles('tools/images.py') }}-${{ github.sha }}
          restore-keys: img-${{ hashFiles('tools/images.py') }}-

      - name: Build website
        env:
          BUILD_ERRORS_FILE: build-errors.md
          CMS_OAUTH_URL: ${{ vars.CMS_OAUTH_URL }}
          CMS_ADMIN: ${{ vars.CMS_ADMIN }}
        run: python3 tools/build.py

      - name: Kiểm canonical, sitemap, liên kết nội bộ
        shell: bash  # bật pipefail: bước kiểm lỗi thì dừng, không đăng
        run: python3 tools/kiem_tra.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Xem GitHub Pages đang đọc nhánh nào
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main | gh-pages | workflow (nguồn "GitHub Actions") | khong-ro (không đọc được cấu hình)
          src=$(gh api "repos/${{ github.repository }}/pages" \
            --jq 'if .build_type == "workflow" then "workflow" else (.source.branch // "khong-ro") end' 2>/dev/null) || src=khong-ro
          echo "branch=${src:-khong-ro}" >> "$GITHUB_OUTPUT"
          echo "GitHub Pages đang đọc: ${src:-khong-ro}"

      # Cấu hình khuyến nghị: Settings → Pages → Deploy from a branch → gh-pages / (root).
      # Luôn đăng, kể cả khi Pages đang đọc main: chuyển nguồn Pages lúc nào thì site cũng là bản mới nhất.
      - name: Đăng lên nhánh gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          commit_message: "Đăng website từ ${{ github.sha }}"

      # Pages đã đọc gh-pages: gỡ bản build cũ còn ở gốc main (1 lần, khi còn .ban-build.txt) để main chỉ còn mã nguồn.
      # Chỉ chạy khi API xác nhận đúng gh-pages; không đọc được cấu hình thì không đụng tới main.
      - name: Gỡ bản build cũ khỏi gốc main
        if: steps.pages.outputs.branch == 'gh-pages'
        run: |
          if [ ! -f .ban-build.txt ]; then echo "Gốc main không còn bản build cũ"; exit 0; fi
          # Giữ tệp nguồn trùng tên tệp build: admin/index.html, CSS, JS, phông, ảnh tải lên
          { grep -Ev '^(admin/index\.html|assets/(css|js|fonts)/|assets/uploads/[^/]+$)' .ban-build.txt || true; } \
            | while read -r f; do git rm -q --ignore-unmatch -- "$f"; done
          git rm -q -- .ban-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Gỡ bản build cũ khỏi gốc main: GitHub Pages đã đọc nhánh gh-pages [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
        shell: bash

      - name: Báo nguồn GitHub Pages sai
        if: steps.pages.outputs.branch == 'workflow'
        run: |
          {
            echo "GitHub Pages đang để nguồn **GitHub Actions** nên website KHÔNG nhận bản mới (bản build mới đã nằm sẵn ở nhánh gh-pages)."
            echo ""
            echo "Sửa (1 phút): repo → **Settings** → **Pages** → *Source*: **Deploy from a branch** → *Branch*: **gh-pages** / **(root)** → **Save**."
          } > build-errors.md
          exit 1

      # Cấu hình cũ (Pages đọc gốc nhánh main): chép bản build vào gốc main, commit [skip ci].
      # .ban-build.txt ghi danh sách tệp do build sinh ra để xóa đúng tệp của trang đã gỡ.
      - name: Đăng vào gốc nhánh main (Pages đang đọc main)
        if: steps.pages.outputs.branch == 'main'
        run: |
          (cd dist && find . -type f | sed 's#^\./##' | sort) > /tmp/moi.txt
          if [ -f .ban-build.txt ]; then
            # Chỉ xóa tệp do build sinh ra; không bao giờ xóa tệp nguồn trùng tên (admin, CSS, JS, phông, ảnh tải lên)
            comm -23 <(sort .ban-build.txt) /tmp/moi.txt | { grep -Ev '^(admin/index\.html|assets/(css|js|fonts)/|assets/uploads/[^/]+$)' || true; } \
              | while read -r f; do git rm -q --ignore-unmatch -- "$f"; done
          fi
          cp -r dist/. .
          cp /tmp/moi.txt .ban-build.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # dist/, .cache/, build-errors.md đã nằm trong .gitignore
          if git diff --cached --quiet; then echo "Bản build không đổi"; exit 0; fi
          git commit -q -m "Cập nhật bản build cho GitHub Pages từ ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          exit 1
        shell: bash

      - name: Báo build lỗi (mở issue → email cho quản trị)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message || '(chạy tay)' }}
          ACTOR: ${{ github.actor }}
        run: |
          gh label create build-loi --color B5000B --description "Build website bị lỗi" --force >/dev/null 2>&1 || true
          {
            echo "**Lần lưu gây lỗi:** ${COMMIT_MSG%%$'\n'*} – bởi @${ACTOR}"
            echo ""
            if [ -f build-errors.md ]; then cat build-errors.md; else echo "Build hoặc bước kiểm bị lỗi. Xem chi tiết: ${RUN_URL}"; fi
            echo ""
            echo "---"
            echo "Website đang chạy vẫn giữ bản cũ. Sửa đúng tệp/trường nêu trên trong /admin rồi bấm Lưu; issue này tự đóng khi build lại thành công."
            echo "Chi tiết kỹ thuật: ${RUN_URL}"
          } > issue.md
          num=$(gh issue list --label build-loi --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file issue.md
          else
            gh issue create --title "Build website lỗi – site vẫn giữ bản cũ" --label build-loi --body-file issue.md
          fi

      - name: Đóng thông báo lỗi khi đã build lại được
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for num in $(gh issue list --label build-loi --state open --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$num" --comment "Đã build và đăng lại thành công (${{ github.sha }})."
          done
