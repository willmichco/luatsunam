    label: Việc nên làm ngay
    widget: list
    field:
      name: muc
      label: Việc
      widget: string
      maxlength: 260
    min: 2
    max: 6
    label_singular: việc
    collapsed: auto
  - name: luu_y
    label: Hộp lưu ý
    widget: object
    fields:
    - name: tieu_de
      label: Tiêu đề
      widget: string
      default: Lưu ý
      maxlength: 40
    - name: noi_dung
      label: Nội dung
      widget: text
      maxlength: 320
