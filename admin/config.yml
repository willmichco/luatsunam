      label: Mô tả
      widget: text
      maxlength: 200
    collapsed: true
  - name: nhan_dau_trang
    label: Nhãn nhỏ trên tiêu đề trang
    widget: string
    hint: 'Ví dụ: Luật sư thừa kế'
    maxlength: 60
  - name: tieu_de_trang
    label: Tiêu đề trang (H1)
    widget: string
    hint: 'Phần cần **tô đỏ** đặt giữa hai dấu sao, ví dụ: `Chia di sản thừa kế đúng luật, *giữ được tình thân*`.'
    maxlength: 120
  - name: mo_dau
    label: Đoạn mở đầu
    widget: text
    minlength: 80
    maxlength: 600
  - name: viec_gap
    label: Hiện ô “Việc gấp?” dưới tiêu đề
    widget: boolean
    hint: Dùng cho lĩnh vực cần gọi ngay, vd. Hình sự.
    required: false
    default: false
  - name: tinh_huong
    label: Tình huống thường gặp
    widget: list
    field:
      name: muc
      label: Tình huống
      widget: string
      maxlength: 220
    min: 3
    max: 8
    label_singular: tình huống
    collapsed: auto
  - name: pham_vi
    label: Luật sư giúp được gì
    widget: object
    fields:
    - name: gioi_thieu
      label: Đoạn giới thiệu
      widget: text
      maxlength: 500
    - name: cac_viec
      label: Các việc
      widget: list
      fields:
      - name: tieu_de
        label: Tên việc
        widget: string
        maxlength: 70
      - name: mo_ta
        label: Mô tả
        widget: text
        maxlength: 300
      summary: '{{fields.tieu_de}}'
      min: 2
      max: 9
      label_singular: việc
      collapsed: auto
    collapsed: true
