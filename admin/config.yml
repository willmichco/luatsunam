      widget: string
      maxlength: 50
    - name: mo_ta
      label: Mô tả
      widget: text
      maxlength: 200
    summary: '{{fields.tieu_de}}'
    min: 3
    max: 6
    label_singular: bước
    collapsed: auto
  - name: giay_to
    label: Giấy tờ
    widget: object
    fields:
    - name: tieu_de
      label: Tiêu đề
      widget: string
      default: Giấy tờ nên mang theo
      maxlength: 60
    - name: danh_sach
      label: Danh sách giấy tờ
      widget: list
      field:
        name: muc
        label: Giấy tờ
        widget: string
        maxlength: 160
      min: 2
      max: 10
      label_singular: giấy tờ
      collapsed: auto
    collapsed: true
  - name: nhan_duoc
    label: Anh chị sẽ nhận được
    widget: list
    field:
      name: muc
      label: Dòng
      widget: string
      maxlength: 160
    min: 2
    max: 8
    label_singular: dòng
    collapsed: auto
  - name: hoi_dap
    label: Hỏi đáp riêng của lĩnh vực
    widget: list
    fields:
    - name: hoi
      label: Câu hỏi
      widget: string
      maxlength: 140
    - name: dap
      label: Câu trả lời
      widget: richtext
      hint: 'Có dẫn điều luật cụ thể, in đậm tên điều luật. Liên kết trong site: dán đường dẫn bắt đầu bằng / (vd. /dich-vu/thua-ke/). Mã chèn tự cập nhật: {{luat_su}}, {{hotline}}, {{email}}, {{dia_chi}}, {{gio_lam_viec}}, {{ngoai_gio}}.'
      buttons:
