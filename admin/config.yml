    min: 1
    max: 8
    label_singular: câu hỏi
    collapsed: auto
  - name: can_cu_phap_ly
    label: Căn cứ pháp luật chủ yếu
    widget: list
    field:
      name: muc
      label: Văn bản
      widget: string
      maxlength: 140
    min: 1
    max: 8
    label_singular: văn bản
    collapsed: auto
  - name: lien_he
    label: Lời mời liên hệ cuối trang
    widget: object
    fields:
    - name: tieu_de
      label: Tiêu đề
      widget: string
      maxlength: 110
    - name: doan_moi
      label: Đoạn mời
      widget: text
      maxlength: 320
    collapsed: true
  - name: linh_vuc_lien_quan
    label: Lĩnh vực liên quan
    widget: relation
    hint: Tối đa 3, hiện cuối trang theo thứ tự chọn.
    required: false
    collection: dich_vu
    value_field: '{{slug}}'
    display_fields:
    - '{{ten}}'
    search_fields:
    - ten
    max: 3
    multiple: true
  - name: seo
    label: SEO – hiển thị trên Google và khi chia sẻ
    widget: object
    fields:
    - name: tieu_de
      label: Tiêu đề trên Google
      widget: string
      hint: 'Dòng chữ xanh trên Google. 15–60 ký tự; đuôi “ | Luật Sư Nam” tự thêm. Ví dụ: Luật sư tư vấn Thừa kế tại TP.HCM'
      minlength: 15
      maxlength: 60
    - name: mo_ta
      label: Mô tả trên Google
      widget: text
      hint: 'Đoạn chữ xám dưới tiêu đề. 70–160 ký tự, nêu rõ việc anh chị được giúp. Ví dụ: Luật sư tư vấn lập di chúc, khai nhận và phân chia di sản, giải quyết tranh chấp thừa kế.'
      minlength: 70
      maxlength: 160
    - name: anh_chia_se
      label: Ảnh chia sẻ Facebook/Zalo (tùy chọn)
      widget: image
      hint: Để trống = tự tạo ảnh từ tiêu đề. Ảnh riêng nên ngang 1200×630.
      required: false
      choose_url: false
    summary: '{{fields.tieu_de}}'
- name: hoi_dap
  label: Hỏi đáp chung
  icon: quiz
  description: 'Kho câu hỏi dùng chung: trang Câu hỏi thường gặp hiện tất cả; các trang khác chọn câu từ đây.'
  files:
  - name: hoi_dap
    label: Kho hỏi đáp
    file: content/hoi-dap.yml
    format: yml
    fields:
    - name: cau_hoi
      label: Câu hỏi (kéo để đổi thứ tự trên trang Câu hỏi thường gặp)
      widget: list
      fields:
      - name: hoi
        label: Câu hỏi
        widget: string
        maxlength: 140
      - name: ma
        label: Mã neo (tùy chọn)
        widget: string
        hint: 'Để trống = tự tạo từ câu hỏi. Trang khác link tới: /cau-hoi-thuong-gap/#<mã>. Đã có mã thì đừng đổi – liên kết cũ sẽ hỏng (build sẽ báo).'
        required: false
        pattern:
        - ^([a-z0-9]+(-[a-z0-9]+)*)?$
        - Chỉ chữ a–z không dấu, số 0–9 và gạch nối
        maxlength: 60
      - name: dap
        label: Câu trả lời
        widget: richtext
