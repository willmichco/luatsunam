seo:
  tieu_de: Luật sư bào chữa vụ án Hình sự
  mo_ta: Luật sư bào chữa cho người bị buộc tội và bảo vệ quyền lợi bị hại qua các giai đoạn điều tra, truy tố, xét xử, kháng cáo. Hỗ trợ khẩn cấp {{hotline}}.
