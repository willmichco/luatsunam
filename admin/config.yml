# TỆP TỰ SINH từ tools/schema.py mỗi lần build – không sửa tay.
# Thêm/sửa trường: sửa tools/schema.py rồi build lại.
app_title: Quản trị website Luật Sư Nam
backend:
  name: github
  repo: willmichco/luatsunam
  branch: main
  commit_messages:
    create: Tạo {{collection}} “{{slug}}”
    update: Cập nhật {{collection}} “{{slug}}”
    delete: Xóa {{collection}} “{{slug}}”
    uploadMedia: Tải lên “{{path}}”
    deleteMedia: Xóa tệp “{{path}}”
  auth_methods:
  - token
site_url: https://willmichco.github.io/luatsunam/
logo:
  src: /luatsunam/assets/img/logo-lsn.webp
media_folder: assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2400
          height: 2400
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
  maxlength: 60
output:
  omit_empty_optional_fields: true
  yaml:
    indent_size: 2
    indent_sequences: true
collections:
- name: bai_viet
  label: Bài viết
  label_singular: bài viết
  icon: article
  description: Bài viết pháp lý tại /kien-thuc-phap-ly/. Bài mới luôn là bản nháp cho tới khi luật sư duyệt.
  folder: content/bai-viet
  extension: md
  format: yaml-frontmatter
  identifier_field: tieu_de
  slug:
    template: '{{tieu_de}}'
    editable:
    - create
    hint: 'Đường dẫn tự tạo từ tiêu đề, bỏ dấu. Nên rút gọn còn 3–6 từ chính. **Sau khi lưu không đổi được** (đổi đường dẫn làm mất thứ hạng Google); cần đổi: xem Cài đặt → Chuyển hướng.'
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - 'Chỉ chữ a–z không dấu, số 0–9 và gạch nối, ví dụ: ly-hon-don-phuong'
  summary: '{{tieu_de}}{{fields.nhap | ternary('' · BẢN NHÁP'', '''')}}'
  sortable_fields:
    fields:
    - ngay_dang
    - tieu_de
    - ngay_cap_nhat
    default:
      field: ngay_dang
      direction: descending
  view_filters:
  - name: nhap
    label: Bản nháp
    field: nhap
    eq: true
  - name: da-dang
    label: Đã đăng
    field: nhap
    ne: true
  preview_path: kien-thuc-phap-ly/{{slug}}/
  fields:
  - name: tieu_de
    label: Tiêu đề bài viết
    widget: string
    hint: 'Hiện ở đầu bài. Ví dụ: Ly hôn đơn phương: căn cứ, hồ sơ và cách Tòa án xem xét quyền nuôi con'
    minlength: 20
    maxlength: 110
  - name: nhap
    label: Bản nháp – chưa đăng lên site
    widget: boolean
    hint: Bài mới luôn là nháp. Chỉ bỏ dấu khi luật sư phụ trách đã duyệt bản xem trước tại /nhap/<đường-dẫn>/.
    required: false
    default: true
  - name: linh_vuc
    label: Lĩnh vực chính
    widget: relation
    hint: Làm chuyên mục của bài và khung “Cần luật sư về…” cạnh bài.
    collection: dich_vu
    value_field: '{{slug}}'
    display_fields:
    - '{{ten}}'
    search_fields:
    - ten
  - name: ngay_dang
    label: Ngày đăng
    widget: datetime
    default: '{{now}}'
    type: date
    format: YYYY-MM-DD
  - name: ngay_cap_nhat
    label: Ngày cập nhật
    widget: datetime
    hint: Ngày rà soát nội dung gần nhất; không được trước ngày đăng. Để trống = ngày đăng.
    required: false
    type: date
    format: YYYY-MM-DD
  - name: tieu_de_ngan
    label: Tiêu đề ngắn trên thẻ bài viết
    widget: string
    hint: Để trống = dùng tiêu đề bài viết.
    required: false
    maxlength: 80
  - name: tom_tat
    label: Tóm tắt trên thẻ bài viết
    widget: text
    hint: 1–2 câu, hiện ở danh sách bài viết.
    minlength: 60
    maxlength: 220
  - name: tom_tat_nhanh
    label: Tóm tắt nhanh (3–4 ý)
    widget: list
    hint: Khung “Tóm tắt nhanh” ở đầu bài. Mỗi ý ≤ 160 ký tự.
    field:
      name: muc
      label: Ý
      widget: string
      maxlength: 160
    min: 3
    max: 4
    label_singular: ý
    collapsed: auto
  - name: doan_dan
    label: Đoạn dẫn đầu bài
    widget: text
    hint: Đoạn mở đầu in to hơn, giới thiệu vấn đề.
    minlength: 80
    maxlength: 700
  - name: body
    label: Nội dung bài viết
    widget: richtext
    hint: 'Dùng **Tiêu đề 2** cho mục chính (tự vào mục lục), **Tiêu đề 3** cho mục nhỏ; nút **Trích dẫn** = hộp lưu ý. Bảng: nút + → Bảng. Liên kết trong site: /dich-vu/thua-ke/. Khẳng định pháp lý luôn kèm điều luật; không hứa hẹn kết quả (Quy tắc 9.1.6).'
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - quote
    editor_components:
    - image
    - bang
    linked_images: false
  - name: linh_vuc_lien_quan
    label: Lĩnh vực liên quan (cột phải)
    widget: relation
    hint: Tối đa 3. Để trống = chỉ lĩnh vực chính.
    required: false
    collection: dich_vu
    value_field: '{{slug}}'
    display_fields:
    - '{{ten}}'
    search_fields:
    - ten
    max: 3
    multiple: true
  - name: seo
    label: SEO – hiển thị trên Google và khi chia sẻ
    widget: object
    fields:
    - name: tieu_de
      label: Tiêu đề trên Google
      widget: string
      hint: 'Dòng chữ xanh trên Google. 15–60 ký tự; đuôi “ | Luật Sư Nam” tự thêm. Ví dụ: Ly hôn đơn phương: căn cứ, hồ sơ, quyền nuôi con'
      minlength: 15
      maxlength: 60
    - name: mo_ta
      label: Mô tả trên Google
      widget: text
      hint: 'Đoạn chữ xám dưới tiêu đề. 70–160 ký tự, nêu rõ việc anh chị được giúp. Ví dụ: Khi nào Tòa án giải quyết ly hôn theo yêu cầu của một bên, hồ sơ cần chuẩn bị và nguyên tắc giao con.'
      minlength: 70
      maxlength: 160
    - name: anh_chia_se
      label: Ảnh chia sẻ Facebook/Zalo (tùy chọn)
      widget: image
      hint: Để trống = tự tạo ảnh từ tiêu đề. Ảnh riêng nên ngang 1200×630.
      required: false
      choose_url: false
    summary: '{{fields.tieu_de}}'
- name: dich_vu
  label: Lĩnh vực dịch vụ
  label_singular: lĩnh vực
  icon: balance
  description: Mỗi lĩnh vực có trang /dich-vu/<đường-dẫn>/, thẻ ở trang chủ, menu và chân trang. Bấm “Sắp xếp lại” để kéo đổi thứ tự.
  folder: content/dich-vu
  extension: yml
  format: yml
  identifier_field: ten
  slug:
    template: '{{ten}}'
    editable:
    - create
    hint: 'Đường dẫn tự tạo từ tiêu đề, bỏ dấu. Nên rút gọn còn 3–6 từ chính. **Sau khi lưu không đổi được** (đổi đường dẫn làm mất thứ hạng Google); cần đổi: xem Cài đặt → Chuyển hướng.'
    pattern:
    - ^[a-z0-9]+(-[a-z0-9]+)*$
    - 'Chỉ chữ a–z không dấu, số 0–9 và gạch nối, ví dụ: ly-hon-don-phuong'
  summary: '{{ten}}{{fields.nhap | ternary('' · BẢN NHÁP'', '''')}}'
  reorder:
    key: thu_tu
  sortable_fields:
    fields:
    - thu_tu
    - ten
    default:
      field: thu_tu
      direction: ascending
  preview_path: dich-vu/{{slug}}/
  fields:
  - name: ten
    label: Tên lĩnh vực
    widget: string
    hint: 'Ví dụ: Thừa kế. Hiện trên menu, thẻ, chân trang.'
    minlength: 3
    maxlength: 45
  - name: nhap
    label: Bản nháp – chưa đăng lên site
    widget: boolean
    required: false
    default: true
  - name: thu_tu
    label: Thứ tự hiển thị
    widget: number
    hint: Số nhỏ đứng trước (hoặc kéo thả bằng nút Sắp xếp ở danh sách).
    default: 99
    value_type: int
    min: 1
    max: 99
  - name: bieu_tuong
    label: Biểu tượng lĩnh vực
    widget: select
    options:
    - label: Cán cân công lý
      value: i-scale
    - label: Búa phán quyết
      value: i-gavel
    - label: Ngôi nhà (thừa kế)
      value: i-inherit
    - label: Tòa nhà (đất đai)
      value: i-house
    - label: Trái tim (gia đình)
      value: i-heart
    - label: Khiên
      value: i-shield
    - label: Khiên có dấu tích
      value: i-shield-check
    - label: Tài liệu
      value: i-doc
    - label: Một người
      value: i-user
    - label: Nhóm người
      value: i-team
    - label: Mạng lưới
      value: i-network
    - label: Kim cương
      value: i-diamond
    - label: Các bước
      value: i-steps
    - label: Sách
      value: i-book
    - label: Dấu hỏi
      value: i-question
    - label: Ổ khóa
      value: i-lock
    - label: Tiền / chi phí
      value: i-coin
    - label: Đồng hồ
      value: i-clock
    - label: Lịch
      value: i-calendar
    - label: Tin nhắn
      value: i-chat
    - label: Điện thoại
      value: i-phone
    - label: Thư
      value: i-mail
    - label: Ghim địa điểm
      value: i-pin
    - label: Dấu tích tròn
      value: i-check-circle
