  - name: seo
    label: SEO mặc định
    file: content/cai-dat/seo.yml
    format: yml
    fields:
    - name: mo_ta_to_chuc
      label: Mô tả công ty cho Google (dữ liệu có cấu trúc)
      widget: text
      maxlength: 300
    - name: anh_chia_se
      label: Ảnh chia sẻ mặc định (tự tạo)
      widget: object
      fields:
      - name: nhan
        label: Dòng nhãn
        widget: string
        maxlength: 50
      - name: tieu_de
        label: Tiêu đề
        widget: string
        maxlength: 60
      - name: mo_ta
        label: Mô tả
        widget: text
        maxlength: 160
      - name: anh_rieng
        label: Hoặc tải ảnh riêng 1200×630
        widget: image
        required: false
        choose_url: false
      collapsed: true
  - name: theo_doi
    label: Mã theo dõi
    file: content/cai-dat/theo-doi.yml
    format: yml
    fields:
    - name: search_console
      label: Mã xác minh Google Search Console
      widget: string
      hint: Chỉ dán phần content của thẻ meta, vd. AbC123…
      required: false
      pattern:
      - ^[A-Za-z0-9_-]{20,90}$
      - Chỉ dán chuỗi mã (chữ, số, - và _), không dán cả thẻ <meta>
    - name: da_cap_nhat_chinh_sach
      label: Đã cập nhật Chính sách bảo mật và thông báo cookie
      widget: boolean
      hint: 'Bắt buộc theo Nghị định 13/2023/NĐ-CP trước khi bật GA4, Meta Pixel, Zalo OA. Chưa tích: các mã dưới KHÔNG được xuất ra site.'
      required: false
      default: false
    - name: ga4
      label: Google Analytics 4 – Measurement ID
      widget: string
      hint: Dạng G-XXXXXXXXXX
      required: false
      pattern:
      - ^(G-[A-Z0-9]{6,12})?$
      - Mã GA4 có dạng G-XXXXXXXXXX
    - name: meta_pixel
      label: Meta Pixel ID
      widget: string
      hint: Dãy 15–16 chữ số
      required: false
      pattern:
      - ^([0-9]{15,16})?$
      - Pixel ID là 15–16 chữ số
    - name: zalo_oa
      label: Zalo OA ID (khung chat)
      widget: string
      hint: Dãy số OA ID
      required: false
      pattern:
      - ^([0-9]{6,25})?$
      - Zalo OA ID là dãy số
  - name: chuyen_huong
    label: Chuyển hướng 301
    file: content/cai-dat/chuyen-huong.yml
    format: yml
    fields:
    - name: chuyen_huong
      label: Đường dẫn cũ → mới
      widget: list
      hint: 'Build kiểm: đích phải là trang có thật, không vòng lặp, đường dẫn cũ không trùng trang đang có.'
      required: false
      fields:
      - name: tu
        label: Đường dẫn cũ
        widget: string
        hint: Bắt đầu và kết thúc bằng /, vd. /doi-ngu-luat-su/
        pattern:
        - ^/([a-z0-9-]+/)+$
        - Dạng /duong-dan/ (chữ thường không dấu, gạch nối)
      - name: den
        label: Chuyển tới
        widget: string
        hint: Trang đang có, vd. /gioi-thieu/#doi-ngu-luat-su
        pattern:
        - ^/([a-z0-9-]+/)*(#[a-z0-9-]+)?$
        - Dạng /duong-dan/ hoặc /duong-dan/#ma-neo
      - name: ghi_chu
        label: Ghi chú
        widget: string
        required: false
        maxlength: 120
      summary: '{{fields.tu}} → {{fields.den}}'
      label_singular: chuyển hướng
      collapsed: auto
  - name: anh_thuong_hieu
    label: Ảnh thương hiệu
    file: content/cai-dat/anh-thuong-hieu.yml
    format: yml
    fields:
    - name: logo
      label: Logo (nền trong suốt, vuông)
      widget: image
      hint: Build tự cắt ra favicon, biểu tượng ứng dụng.
      choose_url: false
      media_folder: /content/anh-thuong-hieu
      public_folder: /content/anh-thuong-hieu
    - name: van_phong
      label: Ảnh luật sư tại văn phòng
      widget: image
      hint: Ảnh ngang. Dùng ở Trang chủ, Giới thiệu, ảnh chia sẻ.
      choose_url: false
      media_folder: /content/anh-thuong-hieu
      public_folder: /content/anh-thuong-hieu
    - name: phien_toa
      label: Ảnh luật sư tại phiên tòa
      widget: image
      hint: Ảnh gần vuông, thấy rõ khuôn mặt. Build cắt ra ảnh thẻ và ảnh tròn.
      choose_url: false
      media_folder: /content/anh-thuong-hieu
      public_folder: /content/anh-thuong-hieu
    - name: khuon_mat
      label: Vị trí khuôn mặt trong ảnh phiên tòa
      widget: object
      hint: Dùng để cắt ảnh tròn và ảnh thẻ cho đúng khuôn mặt khi thay ảnh mới.
      fields:
      - name: x
        label: Ngang (%)
        widget: number
        hint: 0 = mép trái, 100 = mép phải
        value_type: int
        min: 0
        max: 100
      - name: y
        label: Dọc (%)
        widget: number
        hint: 0 = mép trên, 100 = mép dưới
        value_type: int
        min: 0
        max: 100
      collapsed: true
